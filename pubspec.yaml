name: db_pickaxe
description: "DB-Pickaxe: A Windows desktop browser with built-in media sniffer and downloader. Detects and downloads videos, images, HLS streams, and audio from any webpage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.6
  dio: ^5.11.0
  image: ^4.9.2
  file_picker: ^12.1.3
  intl: ^0.20.3
  uuid: ^4.6.0
  window_manager: ^0.5.2
  webview_windows: ^0.4.0
  flutter_inappwebview: ^6.1.5
  open_filex: ^4.7.0
  permission_handler: ^11.4.0
  cached_network_image_ce: ^4.10.1
  flutter_cache_manager: ^3.4.1
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
